spring.application.name=ensora

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

ensora.cors.origem=${CORS_ORIGEM}

# Fuso das contas novas que não informam o próprio; cada usuário tem o seu na coluna usuario.fuso.
ensora.fuso=${FUSO:America/Sao_Paulo}

ensora.jwt.segredo=${JWT_SEGREDO}
ensora.jwt.expiracao-minutos=15

ensora.refresh.expiracao-dias=30

ensora.auth.registro-habilitado=${REGISTRATION_ENABLED:false}
ensora.auth.login-max-tentativas=5
ensora.auth.login-janela-minutos=15
ensora.auth.cadastro-max-tentativas=${CADASTRO_MAX_TENTATIVAS:10}
ensora.auth.cadastro-janela-minutos=${CADASTRO_JANELA_MINUTOS:60}
# Vazio: cadastro sem convite. Preenchido: o cadastro só aceita quem informar este código.
ensora.auth.convite-codigo=${CONVITE_CODIGO:}

# Atrás de um proxy (Render), o IP do cliente vem do X-Forwarded-For. A estratégia native usa o
# RemoteIpValve do Tomcat: só confia no cabeçalho quando a conexão vem de um proxy interno e lê da
# direita para a esquerda, então quem forja o cabeçalho não escolhe o próprio IP. Os proxies
# confiáveis são os padrões do Spring (faixas privadas); ajuste server.tomcat.remoteip.internal-proxies
# se o provedor usar outras.
server.forward-headers-strategy=native
