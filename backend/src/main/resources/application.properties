spring.application.name=ensora

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

ensora.cors.origem=${CORS_ORIGEM}

ensora.jwt.segredo=${JWT_SEGREDO}
ensora.jwt.expiracao-minutos=15

ensora.refresh.expiracao-dias=30

ensora.auth.registro-habilitado=${REGISTRATION_ENABLED:false}
ensora.auth.login-max-tentativas=5
ensora.auth.login-janela-minutos=15
